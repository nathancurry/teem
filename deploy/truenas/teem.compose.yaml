services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: teem
      POSTGRES_USER: teem
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - /mnt/tank/teem/postgres:/var/lib/postgresql/data
      - /mnt/tank/teem/config/postgres_password:/run/secrets/postgres_password:ro
      - /mnt/tank/teem/config/schema.sql:/docker-entrypoint-initdb.d/01-teem.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U teem -d teem"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    # Build from the repository root: docker build --target server -t teem:0.1.0 .
    image: teem:0.1.0
    pull_policy: never
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    user: "568:568"
    env_file: /mnt/tank/teem/config/teem.env
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        exec teem-server serve
        --dsn "$$TEEM_DSN"
        --artifacts /srv/teem/artifacts
        --username "$$TEEM_USER"
        --password "$$TEEM_PASSWORD"
        --worker-id worker-1
        --worker-token "$$TEEM_WORKER_TOKEN"
        --origin "$$TEEM_ORIGIN"
        --reviewer-config /srv/teem/config/reviewer.json
        --vapid-private-key /srv/teem/config/vapid.pem
        --vapid-subject "$$TEEM_VAPID_SUBJECT"
        --host 0.0.0.0
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - /mnt/tank/teem/artifacts:/srv/teem/artifacts
      - /mnt/tank/teem/config:/srv/teem/config:ro
