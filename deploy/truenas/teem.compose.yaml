services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: teem
      POSTGRES_USER: teem
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - /mnt/storage/teem/postgres:/var/lib/postgresql/data
      - /mnt/storage/teem/config/postgres_password:/run/secrets/postgres_password:ro
      - /mnt/storage/teem/config/schema.sql:/docker-entrypoint-initdb.d/01-teem.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U teem -d teem"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    # Optional voice: change this tag to v0.0.1-speech, then enable the
    # speech arguments, read-only speech volume, and scratch tmpfs below.
    image: ghcr.io/nathancurry/teem:v0.0.1
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    user: "568:568"
    env_file: /mnt/storage/teem/config/teem.env
    entrypoint: ["/bin/sh", "-ec"]
    # Voice: add --speech-config /srv/teem/config/speech.json and
    # --speech-scratch /srv/teem/speech-scratch to the command below.
    command:
      - >-
        exec teem-server serve
        --dsn "$$TEEM_DSN"
        --artifacts /srv/teem/artifacts
        --username "$$TEEM_USER"
        --password "$$TEEM_PASSWORD"
        --worker-id worker-1
        --worker-token "$$TEEM_WORKER_TOKEN"
        --origin "$$TEEM_ORIGIN"
        --reviewer-config /srv/teem/config/reviewer.json
        --vapid-private-key /srv/teem/config/vapid.pem
        --vapid-subject "$$TEEM_VAPID_SUBJECT"
        --host 0.0.0.0
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - /mnt/storage/teem/artifacts:/srv/teem/artifacts
      - /mnt/storage/teem/config:/srv/teem/config:ro
      # Voice: uncomment this mount after putting whisper-cli and the model in the speech dataset.
      # - /mnt/storage/teem/speech:/srv/teem/speech:ro
    # Voice: uncomment this UID 568 owned private scratch tmpfs; recordings stay off durable storage.
    # tmpfs:
    #   - /srv/teem/speech-scratch:rw,nosuid,nodev,size=512m,uid=568,gid=568,mode=0700
