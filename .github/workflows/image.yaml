name: Publish images

on:
  push:
    tags:
      - 'v*'

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: server
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: speech
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}-speech
